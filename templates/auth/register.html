{% extends "layout.html" %}

{% block title %}
    Register
{% endblock %}

{% block main %}
<div class="container mt-5" style="max-width: 400px;">
    <h2>Register</h2>
    <form action="/register" method="post">
    <!-- Wrapper Div -->
        <div>
            <div class="mb-3">
                <input class="form-control" autocomplete="off" autofocus name="username" placeholder="Username" type="text">
            </div>
            <div class="mb-3">
                <input class="form-control" name="password" placeholder="Password" type="password">
            </div>
            <div class="mb-3">
                <input class="form-control" name="confirmation" placeholder="Password again" type="password">
            </div>
            <div>
                <!-- Info message (empty by default) -->
                <p style="color:{{ color }}">{{ message }}</p>
            </div>
            <div>
                <button class="btn btn-primary w-100" type="submit">Register</button>
            </div>
        </div>
    </form>
        <div class="mt-3 text-center">
        <p>Already have an account? <a href="{{ url_for('auth.login') }}">Log In</a></p>
    </div>
</div>
{% endblock %}
