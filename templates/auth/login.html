{% extends "layout.html" %}

{% block title %}
    Log In
{% endblock %}

{% block main %}
<div class="container mt-5" style="max-width: 400px;">
    <h2>Log In</h2>
    <form action="/login" method="post">
    <!-- Wrapper Div -->
        <div>
            <div class="mb-3">
                <input class="form-control" autocomplete="off" autofocus name="username" placeholder="Username" type="text">
            </div>
            <div class="mb-3">
                <input class="form-control" name="password" placeholder="Password" type="password">
            </div>
            <div>
                <!-- Info message (empty by default) -->
                <p class="alert" style="color:{{ color }}">{{ message }}</p>
            </div>
            <div>
                <button class="btn btn-primary w-100" type="submit">Log In</button>
            </div>
        </div>
    </form>
</div>
<style>
    .alert {
        /* Box Styling */
        background-color: #f8d7da; /* Light pink background */
        border: 1px solid #f5c6cb; /* Slightly darker pink border */
        border-radius: 5px;        /* Rounded corners */
        
        /* Spacing & Layout */
        padding: 12px 20px;        /* Space inside the box */
        margin-top: 10px;          /* Space above */
        margin-bottom: 20px;       /* Space below */
        width: 100%;               /* Full width */
        box-sizing: border-box;    /* Ensures padding doesn't break width */
        
        /* Font Styles */
        font-family: sans-serif;
        font-size: 14px;
        line-height: 1.5;
    }
</style>

{% endblock %}
