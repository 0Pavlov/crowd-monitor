{% extends "layout.html" %}

{% block title %}
    Tasks
{% endblock %}

{% block main %}
    <h1 style="color:green;">Hello from tasks</h1>
    <!-- Main container -->
    <div class="TasksMain">
        <!-- Tasks overview container -->
        <!-- All of the tasks table -->
        <div class="Tasks">
            {% if session['role'] == 'admin' %}
                <div class="TasksNav">
                    <button>create task</button>
                </div>
                <h1>All tasks:</h1>
            {% else %}
                <h1>My tasks:</h1>
            {% endif %}
        </div>
        <!-- Task container -->
        <!-- The particular task area if one is chosen -->
        <div class="Task">
            <div class="TaskNav">
                <button>back</button>
                <button>expand</button>
                <button>hide</button>
            </div>
            <!-- Task details -->
            <div>
                <h1>NO selected task</h1>
            </div>
        </div>
    <div/>
{% endblock %}
