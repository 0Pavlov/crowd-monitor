<div class="task-container">
  <div class="task-header">
    <svg class="task-icon" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 0 24 24" width="24px" fill="var(--m3-primary)">
      <path d="M0 0h24v24H0V0z" fill="none"/>
      <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
    </svg>
    <h1>Create New Task</h1>
  </div>

  <div class="details-card">
    <form action="/tasks" method="post" id="create-task-form">
      <input type="hidden" name="task_creation_form" value="create_task">

      <div class="form-group">
        <label class="create-task-label">Task Content:</label>
        <textarea name="content" class="create-task-input" rows="3" required placeholder="Describe the task..."></textarea>
      </div>

      <div class="form-group">
        <label class="create-task-label">Gold Standard Answer (For AI Evaluation):</label>
        <textarea name="gsa" class="create-task-input" rows="2" required placeholder="The correct answer..."></textarea>
      </div>

      <div class="form-group">
        <label class="create-task-label">Task Type:</label>
        <select name="task_type" class="create-task-input" required>
          <option value="" disabled selected>Select type</option>
          <option value="classification">Classification</option>
          <option value="ranking">Ranking</option>
          <option value="code">Code</option>
          <option value="free">Free</option>
        </select>
      </div>

      <div class="form-group">
        <label class="create-task-label">Assign Worker:</label>
        <select name="worker" class="create-task-input" required>
          <option value="" disabled selected>Select worker</option>
          {% for username in users %}
              <option value="{{username}}">{{username}}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label class="create-task-label">Deadline:</label>
        <input type="datetime-local" name="deadline" class="create-task-input" required>
      </div>

      <div class="form-group" style="margin-top: 24px;">
        <button type="submit" class="create-task-btn">Create Task</button>
      </div>
    </form>
  </div>
</div>

<style>
  .create-task-input {
    width: 100%;
    padding: 12px 16px;
    background-color: var(--m3-surface-container-high);
    color: var(--m3-on-surface);
    border: 1px solid var(--m3-outline-variant);
    border-radius: 12px;
    margin-top: 4px;
    font-size: 16px;
  }
  .create-task-input:focus {
    outline: none;
    border-color: var(--m3-primary);
  }
  .create-task-label {
    font-size: 14px;
    color: var(--m3-on-surface-variant);
    margin-bottom: 4px;
    display: block;
    font-weight: 500;
  }
  .form-group {
    margin-bottom: 16px;
  }
  .create-task-btn {
    background-color: var(--m3-primary);
    color: var(--m3-on-primary);
    border: none;
    padding: 12px 24px;
    border-radius: 24px;
    cursor: pointer;
    font-weight: 600;
    font-size: 16px;
    transition: filter 0.2s ease;
  }
  .create-task-btn:hover {
    filter: brightness(0.9);
  }
</style>
